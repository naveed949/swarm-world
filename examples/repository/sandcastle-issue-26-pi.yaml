      timeoutMs: 120000
      outputLimit: 12000
      concurrency: 1
      environment:
        CI: "1"
      mandatory: true
    - id: typecheck
      category: typecheck
      executable: /usr/local/bin/node
      args:
        - node_modules/typescript/bin/tsc
        - --project
        - tsconfig.json
        - --noEmit
      workingDirectory: .
      permittedPaths:
