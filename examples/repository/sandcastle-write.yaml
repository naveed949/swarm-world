seed: 3202
population: 2
ticks: 7
macroturnInterval: 1
planLimit: 1
condition: full
planner: scripted
surveyQueries:
  - ISSUE_REPOSITORY
  - sandbox
scriptedChange:
  targetPath: .sandcastle/.env.example
  oldText: "GH_TOKEN=\n"
  newText: "GH_TOKEN=\nISSUE_REPOSITORY=naveed949/sandcastle\n"
  requiredFacilityIds:
    - env-contract

environment:
  type: repository
  root: ../../workspace/target
  baseCommit: b03b295836bdc7ce67846814f02a80705c162122
  readOnly: false
  task:
    id: sandcastle-explicit-repository-example
    title: Document the explicit Sandcastle issue repository
    acceptanceCriteria:
      - The example environment binds issue discovery to naveed949/sandcastle.
      - Credential placeholders remain empty.
    acceptanceFacilityIds:
      - env-contract
    regressionFacilityIds:
      - env-contract
    relevantPaths:
      - .sandcastle/.env.example
    priority: 1
  observationRadius: 2
  observationLimit: 16
  allowedPaths:
    - .sandcastle/.env.example
  excludedPaths:
    - .env
    - node_modules/**
  patch:
    maxFiles: 1
    maxChangedLines: 2
  facilities:
    - id: env-contract
      category: test
      executable: /usr/local/bin/node
      args:
        - -e
        - >-
          const fs = require('node:fs');
          const actual = fs.readFileSync('.sandcastle/.env.example', 'utf8');
          const expected = 'ANTHROPIC_API_KEY=\nGH_TOKEN=\nISSUE_REPOSITORY=naveed949/sandcastle\n';
          if (actual !== expected) process.exit(1);
      workingDirectory: .
      permittedPaths:
        - .sandcastle/.env.example
      mutationClass: none
      timeoutMs: 5000
      outputLimit: 2000
      concurrency: 1
      environment: {}
      mandatory: true
